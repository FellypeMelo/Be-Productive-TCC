name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "${{ github.workspace }}/backend:/src" -w /src golang:1.25-alpine sh -c "go test ./..."

  recommender:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommender
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t be-productive-recommender-ci .
      - run: docker run --rm -e RECOMMENDER_SHARED_SECRET= be-productive-recommender-ci sh -c "PYTHONPATH=/app pytest -q"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t be-productive-frontend-ci .
      - run: docker run --rm be-productive-frontend-ci npm run check
      - run: docker run --rm be-productive-frontend-ci npm test

  ab-experiment-gate:
    runs-on: ubuntu-latest
    needs: [backend, recommender, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build recommender test image
        run: docker build -t be-productive-recommender-gate recommender
      - name: Run contract gate
        run: >-
          docker run --rm be-productive-recommender-gate
          python -m src.evaluation.ab_gate
          --manifest /app/experiment_manifest.sustainable-attention-v1.json
          --input /app/evaluation_gate_fixture.json
          --mode contract
