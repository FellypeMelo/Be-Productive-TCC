name: Bug report
description: Report something that is broken or behaves incorrectly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This repository has **no CI pipeline**, so please include exact commands and output — it's the fastest way for a maintainer to reproduce the issue without a full environment already running.

  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      description: Which part of the stack is affected?
      options:
        - Backend (Go, backend/)
        - Recommender (Python, recommender/)
        - Frontend (SvelteKit, frontend/)
        - Database / migrations
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, endpoint calls, or UI steps, in order.
      placeholder: |
        1. cd backend && go run cmd/server/main.go
        2. curl -X POST http://localhost:8080/api/v1/...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste terminal output, stack traces, or browser console output. This will be rendered as a code block, no need for backticks.
      render: shell

  - type: input
    id: versions
    attributes:
      label: Environment
      description: OS, Node/Go/Python versions, MySQL version.
      placeholder: e.g. Windows 11, Node 20.19, Go 1.25, Python 3.10, MySQL 8.0

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't already been reported.
          required: true
        - label: This is not a security vulnerability (if it is, see SECURITY.md instead of filing here).
          required: true
