openapi: 3.1.0
info:
  title: Be-Productive Gateway API
  version: 2.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /feed:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: category, in: query, schema: {type: string, enum: [PRODUTIVIDADE, ENTRETENIMENTO]}}
        - {name: topic_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: Ranked feed with model metadata and explanations}
  /users/{id}/settings:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {"200": {description: Privacy and research consent settings}}
    put:
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserSettings"}
      responses: {"200": {description: Settings updated}}
  /content/{id}/events:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContentEvent"}
      responses:
        "202": {description: Idempotent event accepted}
        "400": {description: Invalid event}
  /experiments/exposures:
    post:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExperimentExposure"}
      responses:
        "202": {description: Idempotent exposure accepted}
        "400": {description: Invalid exposure contract}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    UserSettings:
      type: object
      required: [sugestao_saudavel_ativa, personalizacao_ativa, notificacao_foco_ativa, consentimento_pesquisa]
      properties:
        sugestao_saudavel_ativa: {type: boolean}
        personalizacao_ativa: {type: boolean}
        notificacao_foco_ativa: {type: boolean}
        consentimento_pesquisa: {type: boolean, description: Explicit opt-in independent of personalization}
    ContentEvent:
      type: object
      required: [event_id, type, dwell_seconds, position, algorithm, experiment, friction_level]
      properties:
        event_id: {type: string, maxLength: 64}
        type: {type: string, enum: [impression, open, complete, hide]}
        dwell_seconds: {type: integer, minimum: 0}
        position: {type: integer, minimum: 0}
        algorithm: {type: string, maxLength: 64}
        experiment: {type: string, maxLength: 64}
        friction_level: {type: string, enum: [none, mild, high, block]}
    ExperimentExposure:
      type: object
      required: [event_id, experiment_id, variant, assignment_version, algorithm_version, request_id, eligible, served, fallback, position_count]
      properties:
        event_id: {type: string, maxLength: 64}
        experiment_id: {type: string, enum: [sustainable-attention-v1]}
        variant: {type: string, enum: [control, treatment]}
        assignment_version: {type: string, enum: [sha256-v1]}
        algorithm_version: {type: string, maxLength: 64}
        request_id: {type: string, maxLength: 128}
        eligible: {type: boolean, const: true}
        served: {type: boolean}
        fallback: {type: boolean}
        position_count: {type: integer, minimum: 0, maximum: 50}
